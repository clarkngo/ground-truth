name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Unit tests (no model server needed)
        run: uv run pytest -q
      - name: Retrieval regression gate
        # Deterministic BM25 retrieval over the ground-truth questions. Fails the build if a corpus, chunking or
        # question change makes the right documents harder to find.
        run: uv run gt gate --config ci-bm25 --min-recall 0.95 --min-mrr 0.90

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked && uv run gt export
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
